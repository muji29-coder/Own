name: "publish npm"

# Not used by the bot. GitHub only runs workflows from the repo's top .github folder,
# and shayan-fca is not published to npm ("private": true in package.json).
# Kept from the original library; runs only when started by hand.
on: workflow_dispatch

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
